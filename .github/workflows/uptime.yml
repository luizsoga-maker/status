name: Uptime

on:
  schedule:
    # A cada 5 minutos (horario UTC; o GitHub pode atrasar alguns minutos em picos)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      simular_queda:
        description: 'Simular queda da loja (aponta para um host inexistente para testar o alerta de ponta a ponta)'
        type: boolean
        required: false
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  monitorar:
    name: Monitorar servicos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      RESULTADOS: ${{ github.workspace }}/resultados.txt
      LABEL_INCIDENTE: incidente

    steps:
      - name: Checar servicos
        env:
          SIMULAR_QUEDA: ${{ inputs.simular_queda }}
        run: |
          set -uo pipefail

          TIMEOUT=10          # segundos por tentativa
          TENTATIVAS=2        # numero de tentativas por servico
          INTERVALO=5         # segundos entre as tentativas

          URL_LOJA="https://outletdascaixas.com.br/br"
          if [ "${SIMULAR_QUEDA:-false}" = "true" ]; then
            URL_LOJA="https://simulacao-de-queda.outletdascaixas.com.br"
            echo "::warning::Modo simulacao ativo: a loja esta sendo checada em $URL_LOJA (host inexistente, de proposito)."
          fi

          : > "$RESULTADOS"

          # checar <nome> <url> <modo>
          #   modo "estrito" -> no ar somente com HTTP 200
          #   modo "edge"    -> a loja fica atras do proxy da Cloudflare com Bot Fight Mode.
          #                     Um challenge (403/503 do edge) prova que a borda esta viva, entao
          #                     so consideramos fora do ar em falha de rede/timeout ou HTTP >= 500.
          #                     Os codigos 520-526 sao "origem fora" e ja caem no >= 500.
          checar() {
            nome="$1"; url="$2"; modo="$3"
            tentativa=1
            codigo="000"
            latencia="0.000"
            estado="DOWN"
            detalhe="sem resposta"

            while [ "$tentativa" -le "$TENTATIVAS" ]; do
              saida="$(curl -s -o /dev/null --max-time "$TIMEOUT" \
                        -A 'outletdascaixas-uptime-monitor/1.0 (+github actions)' \
                        -w '%{http_code} %{time_total}' "$url" 2>/dev/null)"
              rc=$?

              codigo="$(printf '%s' "$saida" | awk '{print $1}')"
              latencia="$(printf '%s' "$saida" | awk '{print $2}')"
              [ -n "$codigo" ] || codigo="000"
              [ -n "$latencia" ] || latencia="0.000"

              if [ "$rc" -ne 0 ]; then
                detalhe="falha de rede/timeout (curl rc=$rc)"
                estado="DOWN"
              elif [ "$modo" = "edge" ]; then
                if [ "$codigo" -ge 500 ]; then
                  detalhe="HTTP $codigo (>= 500: origem fora do ar)"
                  estado="DOWN"
                else
                  detalhe="HTTP $codigo"
                  estado="UP"
                fi
              else
                if [ "$codigo" = "200" ]; then
                  detalhe="HTTP 200"
                  estado="UP"
                else
                  detalhe="HTTP $codigo (esperado 200)"
                  estado="DOWN"
                fi
              fi

              if [ "$estado" = "UP" ]; then
                break
              fi

              if [ "$tentativa" -lt "$TENTATIVAS" ]; then
                echo "  tentativa $tentativa de '$nome' falhou ($detalhe); nova tentativa em ${INTERVALO}s"
                sleep "$INTERVALO"
              fi
              tentativa=$((tentativa + 1))
            done

            ms="$(awk -v t="$latencia" 'BEGIN { printf "%d", t * 1000 }')"
            printf '%s|%s|%s|%s|%s|%s\n' "$nome" "$url" "$estado" "$codigo" "$ms" "$detalhe" >> "$RESULTADOS"
            echo "$estado  $nome -> $detalhe (${ms} ms)"
          }

          checar "Loja"             "$URL_LOJA"                                        "edge"
          checar "Admin"            "https://admin.outletdascaixas.com.br/health"      "estrito"
          checar "API de frete"     "https://frete.outletdascaixas.com.br/api/health"  "estrito"
          checar "Painel de frete"  "https://frete.outletdascaixas.com.br/"            "estrito"

          {
            echo "## Uptime — $(date -u '+%d/%m/%Y %H:%M:%S') UTC ($(TZ=America/Sao_Paulo date '+%H:%M:%S') em Brasilia)"
            echo ""
            echo "| Servico | Status | Latencia |"
            echo "| --- | --- | --- |"
            while IFS='|' read -r nome url estado codigo ms detalhe; do
              if [ "$estado" = "UP" ]; then
                icone="🟢 no ar"
              else
                icone="🔴 fora do ar"
              fi
              echo "| $nome | $icone — $detalhe | ${ms} ms |"
            done < "$RESULTADOS"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir, manter ou fechar o incidente
        run: |
          set -uo pipefail

          FORA="$(awk -F'|' '$3 == "DOWN" { printf "%s%s", sep, $1; sep = ", " }' "$RESULTADOS")"

          # Issue de incidente aberta (se houver). So existe uma por vez, por construcao.
          ABERTA="$(gh issue list --label "$LABEL_INCIDENTE" --state open --limit 1 --json number,createdAt)"
          NUMERO="$(printf '%s' "$ABERTA" | jq -r '.[0].number // empty')"
          CRIADA_EM="$(printf '%s' "$ABERTA" | jq -r '.[0].createdAt // empty')"

          agora_utc="$(date -u '+%d/%m/%Y %H:%M:%S') UTC"
          agora_br="$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M:%S') (Brasilia)"

          # ---------- Tudo no ar ----------
          if [ -z "$FORA" ]; then
            if [ -z "$NUMERO" ]; then
              echo "Todos os servicos no ar e nenhum incidente aberto. Nada a fazer."
              echo "_Todos os servicos no ar. Nenhum incidente aberto._" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            duracao="desconhecida"
            if [ -n "$CRIADA_EM" ]; then
              inicio="$(date -u -d "$CRIADA_EM" +%s 2>/dev/null || true)"
              if [ -n "$inicio" ]; then
                total=$(( $(date -u +%s) - inicio ))
                [ "$total" -lt 0 ] && total=0
                horas=$(( total / 3600 ))
                minutos=$(( (total % 3600) / 60 ))
                if [ "$horas" -gt 0 ]; then
                  duracao="aproximadamente ${horas}h ${minutos}min"
                else
                  duracao="aproximadamente ${minutos}min"
                fi
              fi
            fi

            {
              echo "## 🟢 Recuperado"
              echo ""
              echo "Todos os servicos voltaram a responder."
              echo ""
              echo "- **Duracao da queda:** $duracao"
              echo "- **Normalizado em:** $agora_utc"
              echo "- **Horario de Brasilia:** $agora_br"
              echo ""
              echo "| Servico | Status | Latencia |"
              echo "| --- | --- | --- |"
              while IFS='|' read -r nome url estado codigo ms detalhe; do
                echo "| $nome | 🟢 $detalhe | ${ms} ms |"
              done < "$RESULTADOS"
              echo ""
              echo "_Fechado automaticamente pelo monitor._"
            } > recuperado.md

            gh issue comment "$NUMERO" --body-file recuperado.md
            gh issue close "$NUMERO" --reason completed
            echo "Incidente #${NUMERO} comentado e fechado (duracao: $duracao)."
            echo "_🟢 Recuperado: incidente #${NUMERO} fechado. Duracao da queda: ${duracao}._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---------- Algo fora do ar, incidente ja aberto ----------
          if [ -n "$NUMERO" ]; then
            echo "Servicos fora do ar ($FORA), mas o incidente #${NUMERO} ja esta aberto. Nao vou notificar de novo."
            echo "_🔴 Fora do ar: **${FORA}**. Incidente ${SERVER_URL}/${GH_REPO}/issues/${NUMERO} ja aberto — sem novo alerta, para nao repetir e-mail a cada 5 minutos._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---------- Algo fora do ar e nenhum incidente aberto ----------
          {
            echo "O monitor automatico detectou que um ou mais servicos pararam de responder."
            echo ""
            echo "- **Detectado em:** $agora_utc"
            echo "- **Horario de Brasilia:** $agora_br"
            echo ""
            echo "## Situacao de cada servico"
            echo ""
            echo "| Servico | Status | Detalhe | Latencia |"
            echo "| --- | --- | --- | --- |"
            while IFS='|' read -r nome url estado codigo ms detalhe; do
              if [ "$estado" = "UP" ]; then
                icone="🟢 no ar"
              else
                icone="🔴 fora do ar"
              fi
              echo "| $nome | $icone | $detalhe | ${ms} ms |"
            done < "$RESULTADOS"
            echo ""
            echo "Cada servico foi checado com timeout de 10s e ate 2 tentativas espacadas em 5s antes de ser considerado fora do ar."
            echo ""
            echo "## O que acontece agora"
            echo ""
            echo "- Enquanto esta issue estiver aberta o monitor **nao** abre outra nem manda novo alerta."
            echo "- Quando todos os servicos voltarem, o monitor comenta aqui e fecha a issue sozinho."
            echo ""
            echo "cc @luizsoga-maker"
          } > incidente.md

          # Garante que a label existe: o monitor ficaria mudo se ela fosse apagada.
          gh label create "$LABEL_INCIDENTE" --color B60205 \
            --description "Servico fora do ar detectado pelo monitor" 2>/dev/null || true

          URL_ISSUE="$(gh issue create \
            --title "🔴 Fora do ar: $FORA" \
            --label "$LABEL_INCIDENTE" \
            --body-file incidente.md)"

          echo "Incidente aberto: $URL_ISSUE"
          echo "_🔴 Fora do ar: **${FORA}**. Incidente aberto: ${URL_ISSUE}_" >> "$GITHUB_STEP_SUMMARY"

          # Falhar o run de proposito: o e-mail nativo de "workflow falhou" e o segundo aviso.
          exit 1
